
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>CR7 LIKES</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  padding: 25px 18px;
}

header {
  text-align: center;
  padding: 35px 10px;
}

.logo {
  font-size: 38px;
  font-weight: 900;
  color: #ff2525;
  letter-spacing: 2px;
}

.logo span {
  color: white;
}

.subtitle {
  color: #999;
  margin-top: 10px;
  font-size: 13px;
}

.card {
  background: #151515;
  border: 1px solid #292929;
  border-radius: 16px;
  padding: 23px;
  margin-top: 20px;
}

h2 {
  font-size: 19px;
  margin-bottom: 10px;
}

.description {
  color: #999;
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 22px;
}

label {
  display: block;
  margin-bottom: 9px;
  font-size: 13px;
  color: #ddd;
}

input {
  width: 100%;
  padding: 16px;
  border: 1px solid #444;
  border-radius: 10px;
  background: #090909;
  color: white;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #ff2525;
}

button {
  width: 100%;
  margin-top: 17px;
  padding: 16px;
  border: none;
  border-radius: 10px;
  background: #e51d25;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  background: #a91118;
}

.result {
  display: none;
  margin-top: 18px;
  padding: 15px;
  background: #202020;
  border-radius: 10px;
  line-height: 1.6;
  font-size: 13px;
}

.status {
  color: #ff5555;
  font-size: 12px;
  margin-top: 20px;
  text-align: center;
}

footer {
  text-align: center;
  color: #666;
  font-size: 11px;
  margin-top: 35px;
}
</style>
</head>

<body>

<header>
  <div class="logo">CR7 <span>LIKES</span></div>
  <p class="subtitle">PLATAFORMA FREE FIRE</p>
</header>

<main>
  <section class="card">
    <h2>Enviar curtidas</h2>
    <p class="description">
      Digite o ID do jogador para iniciar a validação.
    </p>

    <label for="playerId">ID DO JOGADOR</label>
    <input
      id="playerId"
      type="text"
      inputmode="numeric"
      placeholder="Digite o ID do Free Fire"
      maxlength="20"
    >

    <button onclick="validatePlayer()">
      VALIDAR ID
    </button>

    <div class="result" id="result"></div>
  </section>

  <p class="status">
    ● PROTÓTIPO EM DESENVOLVIMENTO
  </p>
</main>

<footer>
  CR7 LIKES © 2026<br>
  Projeto independente.
</footer>

<script>
function validatePlayer() {
  const id = document.getElementById("playerId").value.trim();
  const result = document.getElementById("result");

  result.style.display = "block";

  if (!/^[0-9]{5,20}$/.test(id)) {
    result.innerHTML =
      "Digite um ID válido, contendo apenas números.";
    return;
  }

  result.innerHTML =
    "ID informado: <strong>" + id +
    "</strong><br><br>" +
    "Validação local concluída.<br>" +
    "A consulta do Nick e o envio de curtidas " +
    "ainda dependem de uma integração autorizada da Garena.";
}
</script>

</body>
  </html>
